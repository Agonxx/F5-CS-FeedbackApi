name: CI/CD - FeedbackApi

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: '9.0.x'
  IMAGE_NAME: f5-cs-feedbackapi

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build
        run: dotnet build FeedbackApi.Api/FeedbackApi.Api.csproj --configuration Release

      - name: Test
        run: dotnet test FeedbackApi.Tests/FeedbackApi.Tests.csproj --configuration Release --logger "trx;LogFileName=test-results.trx"

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/test-results.trx'

  build-image:
    name: Build Docker image
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Só valida que a imagem builda — não publica em nenhum registry
      # (o deploy é manual, num cluster k8s local; ver
      # conexao-solidaria/k8s/README.md).
      - name: Build image
        run: docker build -t "${{ env.IMAGE_NAME }}:${{ github.sha }}" .
